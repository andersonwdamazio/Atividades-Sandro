<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS no Browser</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="exemplos">
        <h1>Lista de Compras</h1>
        <form a="adicionar(event)">
            <label for="produto">Informe o Produto:</label>
            <input type="text" name="produto">
            <label for="quantidade">Informe a Quantidade:</label>
            <input type="number" min="1" name="Quantidade">
            <button>
                Adicionar
            </button>
        </form>
        <ul class="container"></ul>
    </section>
</body>

<script src="./script.js"></script>
</html>
