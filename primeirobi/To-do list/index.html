<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tarefas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Lista de tarefas</h1>

    <form id="formulario">
      <input
        type="text"
        id="tarefa"
        placeholder="Digite uma tarefa"
      >
      <button type="submit">Adicionar</button>
    </form>

    <p class="citacao">
      “Gostamos de listas porque não queremos morrer. É uma forma de criar uma ilusão de controle sobre o tempo e o caos.”
      <br>
      — Umberto Eco
    </p>

    <ul id="lista"></ul>
  </div>
</body>
</html>
